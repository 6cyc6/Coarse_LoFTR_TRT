[workspace]
name = "coarse-loftr-trt"
version = "0.1.0"
description = "Coarse LoFTR, EfficientLoFTR, LoFTR, LoMa and RoMa v2 with TensorRT engines"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12" }]

[dependencies]
python = "3.11.*"
numpy = "1.26.4.*"
py-opencv = "4.10.*"
matplotlib = "*"
tqdm = "*"
yacs = "*"
# LoMa and RoMa v2 read images with PIL
pillow = "*"
git = "*"
# pytorch-lightning 1.9 still imports pkg_resources
setuptools = "<75"

# torch and TensorRT match the tracker's `trt` environment (torch 2.9.1 with CUDA 12.8 wheels + TensorRT 10.9).
# RoMa v2 needs torch >= 2.5 and its DINOv3 backbone >= 2.7; LoMa needs torchvision >= 0.23.
[pypi-dependencies]
torch = "==2.9.1"
torchvision = "==0.24.1"
tensorrt-cu12 = "==10.9.0.34"
onnx = "==1.16.2"
kornia = "==0.7.3"
einops = "*"
loguru = "*"
joblib = "*"
# Only needed because upstream EfficientLoFTR imports `rank_zero_only` from it.
pytorch-lightning = "==1.9.5"
gdown = "*"
# legacy Coarse LoFTR: webcam.py --onnx and training logs
onnxruntime-gpu = "==1.22.0"
tensorboard = "*"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

# SLiM (third_party/SLiM): its torch model needs mamba-ssm, causal-conv1d and VMamba's selective scan kernel,
# which is compiled with the system CUDA toolkit (pixi run build-slim-kernels); the default environment stays free of them.
[feature.slim.dependencies]
pip = "*"
wheel = "*"

[feature.slim.pypi-dependencies]
mamba-ssm = { url = "https://github.com/state-spaces/mamba/releases/download/v2.2.2/mamba_ssm-2.2.2+cu122torch2.4cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.4.0/causal_conv1d-1.4.0+cu122torch2.4cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }
transformers = "==4.42.4"  # mamba-ssm dependency, the version SLiM uses
timm = "*"
fvcore = "*"

[feature.slim.activation.env]
CUDA_HOME = "/usr/local/cuda-12.4"

[feature.slim.tasks]
build-slim-kernels = { cmd = "bash run/build_slim_kernels.sh", description = "Compile VMamba's selective scan kernel that SLiM's torch model uses (once per environment)" }

[feature.slim.tasks.build-slim-plugin]
description = "Compile the TensorRT selective scan plugin to build/slim_plugin"
cmd = "bash run/build_slim_plugin.sh"
inputs = ["run/build_slim_plugin.sh", "slim/plugin/**"]
outputs = ["build/slim_plugin/libslim_trt_plugins.so"]

[feature.slim.tasks.export-slim-onnx]
description = "Export a fixed-shape SLiM ONNX model (640x480, indoor test settings)"
args = [{ arg = "precision", default = "mixed" }]
cmd = "python scripts/trt/export_slim_onnx.py --precision {{ precision }}"

[feature.slim.tasks.build-slim-engine]
description = "Export a SLiM ONNX model and build its TensorRT engine with the selective scan plugin"
args = [{ arg = "precision", default = "mixed" }]
cmd = "python scripts/trt/build_trt_engine.py --onnx weights/slim/slim_indoor_{{ precision }}_480x640.onnx"
depends-on = [{ task = "build-slim-plugin" }, { task = "export-slim-onnx", args = ["{{ precision }}"] }]

[environments]
default = { solve-group = "default" }
slim = { features = ["slim"], solve-group = "default" }

[tasks]
init-submodules = { cmd = "git submodule update --init --recursive", description = "Fetch the pinned EfficientLoFTR, LoMa, RoMa v2 and SLiM sources" }
download-weights = { cmd = "python -m eloftr.download", description = "Download eloftr_outdoor.ckpt to weights/eloftr" }
download-scannet = { cmd = "bash run/download_scannet.sh", description = "Download the ScanNet-1500 test set to $DATASET_DIR (set in run/env.sh)" }

[tasks.export-onnx]
description = "Export a fixed-shape EfficientLoFTR ONNX model"
args = [
  { arg = "height", default = "480" },
  { arg = "width", default = "640" },
  { arg = "model_type", default = "full" },
  { arg = "precision", default = "mixed" },
]
cmd = "python scripts/trt/export_eloftr_onnx.py --height {{ height }} --width {{ width }} --model-type {{ model_type }} --precision {{ precision }}"

[tasks.build-engine]
description = "Export an ONNX model and build a TensorRT engine for EfficientLoFTR"
args = [
  { arg = "height", default = "480" },
  { arg = "width", default = "640" },
  { arg = "model_type", default = "full" },
  { arg = "precision", default = "mixed" },
]
cmd = "python scripts/trt/build_trt_engine.py --onnx weights/eloftr/eloftr_{{ model_type }}_{{ precision }}_{{ height }}x{{ width }}.onnx"
depends-on = [{ task = "export-onnx", args = ["{{ height }}", "{{ width }}", "{{ model_type }}", "{{ precision }}"] }]

[tasks.build-default]
description = "Build the default 640x480 and 384x384 mixed-precision engines, full and opt"
depends-on = [
  { task = "build-engine", args = ["480", "640", "full", "mixed"] },
  { task = "build-engine", args = ["384", "384", "full", "mixed"] },
  { task = "build-engine", args = ["480", "640", "opt", "mixed"] },
  { task = "build-engine", args = ["384", "384", "opt", "mixed"] },
]

[tasks.eval]
description = "Compare TensorRT engines against the torch EfficientLoFTR (accuracy and speed)"
cmd = "python scripts/eval/eval_eloftr.py"

[tasks.eval-scannet]
description = "ScanNet-1500 relative pose accuracy and speed of all engines and their torch models"
cmd = "python scripts/eval/eval_scannet.py"

[tasks.match]
description = "Match two images and save a visualization"
cmd = "python scripts/match_eloftr.py"

[tasks.export-loftr-onnx]
description = "Export a fixed-shape original LoFTR (kornia, coarse + fine) ONNX model"
args = [
  { arg = "height", default = "480" },
  { arg = "width", default = "640" },
  { arg = "pretrained", default = "outdoor" },
  { arg = "precision", default = "mixed" },
]
cmd = "python scripts/trt/export_loftr_onnx.py --height {{ height }} --width {{ width }} --pretrained {{ pretrained }} --precision {{ precision }}"

[tasks.build-loftr-engine]
description = "Export an ONNX model and build a TensorRT engine for the original LoFTR"
args = [
  { arg = "height", default = "480" },
  { arg = "width", default = "640" },
  { arg = "pretrained", default = "outdoor" },
  { arg = "precision", default = "mixed" },
]
cmd = "python scripts/trt/build_trt_engine.py --onnx weights/loftr/loftr_{{ pretrained }}_{{ precision }}_{{ height }}x{{ width }}.onnx"
depends-on = [{ task = "export-loftr-onnx", args = ["{{ height }}", "{{ width }}", "{{ pretrained }}", "{{ precision }}"] }]

[tasks.export-loma-onnx]
description = "Export a fixed-shape LoMa ONNX model (variant b128 or b)"
args = [
  { arg = "variant", default = "b128" },
  { arg = "height", default = "384" },
  { arg = "width", default = "384" },
  { arg = "precision", default = "fp16" },
]
cmd = "python scripts/trt/export_loma_onnx.py --variant {{ variant }} --height {{ height }} --width {{ width }} --precision {{ precision }}"

[tasks.build-loma-engine]
description = "Export an ONNX model and build a TensorRT engine for LoMa"
args = [
  { arg = "variant", default = "b128" },
  { arg = "height", default = "384" },
  { arg = "width", default = "384" },
  { arg = "precision", default = "fp16" },
]
cmd = "python scripts/trt/build_trt_engine.py --onnx weights/loma/loma_{{ variant }}_{{ precision }}_{{ height }}x{{ width }}.onnx"
depends-on = [{ task = "export-loma-onnx", args = ["{{ variant }}", "{{ height }}", "{{ width }}", "{{ precision }}"] }]

[tasks.build-loma-default]
description = "Build the LoMa-B128 (384x384, 640x480) and LoMa-B (392x392, 672x504) fp16 engines"
depends-on = [
  { task = "build-loma-engine", args = ["b128", "384", "384", "fp16"] },
  { task = "build-loma-engine", args = ["b128", "480", "640", "fp16"] },
  { task = "build-loma-engine", args = ["b", "392", "392", "fp16"] },
  { task = "build-loma-engine", args = ["b", "504", "672", "fp16"] },
]

[tasks.export-romav2-onnx]
description = "Export a fixed-shape RoMa v2 ONNX model"
args = [
  { arg = "height", default = "384" },
  { arg = "width", default = "384" },
  { arg = "precision", default = "fp16" },
]
cmd = "python scripts/trt/export_romav2_onnx.py --height {{ height }} --width {{ width }} --precision {{ precision }}"

[tasks.build-romav2-engine]
description = "Export an ONNX model and build a TensorRT engine for RoMa v2"
args = [
  { arg = "height", default = "384" },
  { arg = "width", default = "384" },
  { arg = "precision", default = "fp16" },
]
cmd = "python scripts/trt/build_trt_engine.py --onnx weights/romav2/romav2_{{ precision }}_{{ height }}x{{ width }}.onnx"
depends-on = [{ task = "export-romav2-onnx", args = ["{{ height }}", "{{ width }}", "{{ precision }}"] }]

[tasks.build-romav2-default]
description = "Build the RoMa v2 384x384 and 640x480 fp16 engines (DINOv3 in bf16)"
depends-on = [
  { task = "build-romav2-engine", args = ["384", "384", "fp16"] },
  { task = "build-romav2-engine", args = ["480", "640", "fp16"] },
]

[tasks.build-legacy]
description = "Build the legacy Coarse LoFTR engine with the pixi TensorRT"
cmd = "bash run/export_trt.sh"
